<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atlas — Voz (micrófono)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a1218;
      --panel: #111c24;
      --accent: #22d3ee;
      --muted: #94a3b8;
      --danger: #f87171;
      --ok: #86efac;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top, #0f2733, var(--bg));
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid rgba(34, 211, 238, 0.25);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 0 40px rgba(34, 211, 238, 0.08);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.35rem; letter-spacing: 0.04em; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; line-height: 1.4; }
  #ptt {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 1.1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #0891b2, #06b6d4);
      color: #042f2e;
      user-select: none;
      touch-action: none;
    }
    #ptt:active, #ptt.listening {
      background: linear-gradient(135deg, #0e7490, #22d3ee);
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.45);
    }
    #ptt:disabled { opacity: 0.45; cursor: not-allowed; }
    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 0.75rem; text-align: center; }
    .status {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      background: rgba(0,0,0,0.25);
      font-size: 0.9rem;
      min-height: 3rem;
      white-space: pre-wrap;
    }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .status.warn { color: #fcd34d; }
    label { display: block; font-size: 0.75rem; color: var(--muted); margin-top: 1rem; }
    input, textarea {
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      border: 1px solid rgba(148,163,184,0.3);
      background: #0b1419;
      color: #e2e8f0;
      font: inherit;
    }
    textarea { min-height: 2.5rem; resize: vertical; }
    .row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .row button {
      flex: 1;
      padding: 0.45rem 0.6rem;
      border-radius: 8px;
      border: 1px solid rgba(34,211,238,0.35);
      background: rgba(34,211,238,0.08);
      color: #e2e8f0;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .row button:hover { background: rgba(34,211,238,0.15); }
    .conn { font-size: 0.75rem; margin-top: 0.5rem; color: var(--muted); }
    .conn.ok { color: var(--ok); }
    .conn.bad { color: var(--danger); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Atlas Desktop — Voz</h1>
    <p class="sub">
      1) Pegá el mismo secreto que en <code>.env</code><br>
      2) Clic en «Probar conexión»<br>
      3) Mantené el botón y hablá: «Atlas, estado del sistema»
    </p>

    <label for="secret">Secreto local (x-jarvis-secret)</label>
    <input id="secret" type="password" autocomplete="off" placeholder="mi-atlas-2026-secreto" />
    <div class="row">
      <button type="button" id="testBtn">Probar conexión</button>
      <button type="button" id="sendTextBtn">Enviar texto</button>
    </div>
    <div id="conn" class="conn">Sin probar aún</div>

    <button type="button" id="ptt" disabled style="margin-top:1rem">Inicializando micrófono…</button>
    <p class="hint">Chrome o Edge · permití el micrófono cuando lo pida Windows</p>

    <label for="manual">Prueba sin micrófono</label>
    <textarea id="manual" placeholder="Atlas, estado del sistema"></textarea>

    <div id="status" class="status">Esperando…</div>
  </div>

  <script>
    const ptt = document.getElementById("ptt");
    const statusEl = document.getElementById("status");
    const secretInput = document.getElementById("secret");
    const connEl = document.getElementById("conn");
    const testBtn = document.getElementById("testBtn");
    const sendTextBtn = document.getElementById("sendTextBtn");
    const manualInput = document.getElementById("manual");

    const params = new URLSearchParams(location.search);
    const storedSecret = localStorage.getItem("atlas_jarvis_secret") || params.get("secret") || "";
    if (storedSecret) secretInput.value = storedSecret;

    function getSecret() {
      return secretInput.value.trim() || localStorage.getItem("atlas_jarvis_secret") || "";
    }

    secretInput.addEventListener("change", () => {
      localStorage.setItem("atlas_jarvis_secret", secretInput.value.trim());
      connEl.textContent = "Secreto guardado — probá conexión";
      connEl.className = "conn";
    });

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    async function testConnection() {
      const secret = getSecret();
      if (!secret) {
        connEl.textContent = "Falta el secreto";
        connEl.className = "conn bad";
        setStatus("Escribí el secreto (mismo valor que JARVIS_DESKTOP_SECRET en .env).", "error");
        return false;
      }
      localStorage.setItem("atlas_jarvis_secret", secret);
      connEl.textContent = "Probando…";
      connEl.className = "conn";
      try {
        const res = await fetch("/health", { headers: { "x-jarvis-secret": secret } });
        if (res.status === 401) {
          connEl.textContent = "401 — Secreto incorrecto. Reiniciá «npm run dev» después de editar .env";
          connEl.className = "conn bad";
          setStatus("El agente no acepta ese secreto. Verificá .env y reiniciá el agente (Ctrl+C → npm run dev).", "error");
          return false;
        }
        if (!res.ok) {
          connEl.textContent = "Error " + res.status;
          connEl.className = "conn bad";
          return false;
        }
        const json = await res.json();
        connEl.textContent = "Conectado · agente " + (json.version || "ok");
        connEl.className = "conn ok";
        setStatus("Conexión OK. Mantené el botón y hablá.", "ok");
        return true;
      } catch (err) {
        connEl.textContent = "No hay agente en 127.0.0.1:8787";
        connEl.className = "conn bad";
        setStatus("Agente no corriendo. En Git CMD: cd apps\\jarvis-desktop-agent && npm run dev", "error");
        return false;
      }
    }

    function hasWakeWord(text) {
      const n = text.toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/[^\w\s]/g, " ");
      return /\batlas\b/.test(n) || /\bjarvis\b/.test(n) || /\bat las\b/.test(n) || /\batl[ao]s\b/.test(n);
    }

    async function sendCommand(text) {
      const secret = getSecret();
      if (!secret) {
        setStatus("Configurá el secreto primero.", "error");
        return;
      }
      const trimmed = text.trim();
      if (!trimmed) {
        setStatus("Escribí o decí un comando.", "error");
        return;
      }
      if (!hasWakeWord(trimmed)) {
        setStatus("Falta «Atlas» al inicio. Decí: «Atlas, estado del sistema»", "error");
        return;
      }
      setStatus("Enviando: " + trimmed);
      try {
        const res = await fetch("/voice/stop", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-jarvis-secret": secret,
          },
          body: JSON.stringify({ text: trimmed }),
        });
        const json = await res.json();
        if (res.status === 401) {
          setStatus("401 Unauthorized — secreto incorrecto o reiniciá npm run dev", "error");
          connEl.textContent = "401 — secreto incorrecto";
          connEl.className = "conn bad";
          return;
        }
        if (!res.ok) {
          setStatus(json.error || "Error " + res.status, "error");
          return;
        }
        const msg = json.summary || JSON.stringify(json);
        setStatus(msg, json.status === "ok" ? "ok" : "warn");
      } catch (err) {
        setStatus("No pude contactar al agente: " + err.message, "error");
      }
    }

    testBtn.addEventListener("click", () => void testConnection());
    sendTextBtn.addEventListener("click", () => void sendCommand(manualInput.value || "Atlas, estado del sistema"));
    manualInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        void sendCommand(manualInput.value);
      }
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      setStatus("Usá Chrome o Edge para micrófono. Podés «Enviar texto» abajo.", "warn");
      ptt.textContent = "Mic no disponible";
    } else {
      let recognition = null;
      let listening = false;
      let finalTranscript = "";
      let micReady = false;

      async function ensureMic() {
        if (micReady) return true;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach((t) => t.stop());
          micReady = true;
          return true;
        } catch (err) {
          setStatus("Permiso de micrófono denegado. Configuración → Privacidad → Micrófono → Chrome/Edge.", "error");
          return false;
        }
      }

      function setupRecognition() {
        recognition = new SpeechRecognition();
        recognition.lang = "es-AR";
        recognition.interimResults = true;
        recognition.continuous = true;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
          listening = true;
          ptt.classList.add("listening");
          ptt.textContent = "Escuchando… soltá para enviar";
          setStatus("Hablá ahora (2–3 segundos)…");
        };

        recognition.onresult = (ev) => {
          let interim = "";
          for (let i = ev.resultIndex; i < ev.results.length; i++) {
            const t = ev.results[i][0].transcript;
            if (ev.results[i].isFinal) finalTranscript += t + " ";
            else interim += t;
          }
          setStatus((finalTranscript + interim).trim() || "…");
        };

        recognition.onerror = (ev) => {
          if (ev.error === "no-speech") {
            setStatus("No se detectó voz. Mantené el botón más tiempo y hablá más fuerte.", "error");
          } else if (ev.error === "not-allowed") {
            setStatus("Micrófono bloqueado. Permitilo en Windows y recargá la página.", "error");
          } else {
            setStatus("Error micrófono: " + ev.error, "error");
          }
        };

        recognition.onend = async () => {
          listening = false;
          ptt.classList.remove("listening");
          ptt.textContent = "Mantené para hablar (o Espacio)";
          const text = finalTranscript.trim();
          finalTranscript = "";
          if (!text) return;
          await sendCommand(text);
        };
      }

      async function startListen() {
        if (listening) return;
        if (!(await ensureMic())) return;
        if (!(await testConnection())) return;
        finalTranscript = "";
        setupRecognition();
        try {
          recognition.start();
        } catch {
          /* already started */
        }
      }

      function stopListen() {
        if (!listening || !recognition) return;
        try {
          recognition.stop();
        } catch {
          /* ignore */
        }
      }

      ptt.disabled = false;
      ptt.textContent = "Mantené para hablar (o Espacio)";

      ptt.addEventListener("mousedown", (e) => { e.preventDefault(); void startListen(); });
      ptt.addEventListener("mouseup", stopListen);
      ptt.addEventListener("mouseleave", stopListen);
      ptt.addEventListener("touchstart", (e) => { e.preventDefault(); void startListen(); }, { passive: false });
      ptt.addEventListener("touchend", (e) => { e.preventDefault(); stopListen(); });

      document.addEventListener("keydown", (e) => {
        if (e.code === "Space" && e.target === document.body) {
          e.preventDefault();
          void startListen();
        }
      });
      document.addEventListener("keyup", (e) => {
        if (e.code === "Space") stopListen();
      });
    }

    if (storedSecret) void testConnection();
  </script>
</body>
</html>
