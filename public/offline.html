<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión — Madsjeez</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #030712;
    color: #fff;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }
  .icon {
    width: 72px;
    height: 72px;
    background: #f97316;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
  }
  h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 0.5rem; }
  p { color: #9ca3af; font-size: 0.9375rem; line-height: 1.6; max-width: 320px; margin: 0 auto 2rem; }
  a {
    background: #f97316;
    color: #fff;
    font-weight: 700;
    padding: 0.75rem 2rem;
    border-radius: 12px;
    text-decoration: none;
    font-size: 0.9375rem;
    display: inline-block;
  }
  a:hover { background: #ea580c; }
</style>
</head>
<body>
  <div class="icon">
    <svg width="36" height="36" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <line x1="12" y1="18" x2="12" y2="18.01"/>
    </svg>
  </div>
  <h1>Sin conexión</h1>
  <p>Para usar Madsjeez necesitás conexión a internet. Conectate a wifi o datos y volvé a intentarlo.</p>
  <a href="/" onclick="location.reload(); return false;">Reintentar</a>
</body>
</html>
