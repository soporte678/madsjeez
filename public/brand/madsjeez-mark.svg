<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="MadsJeez">
  <defs>
    <linearGradient id="mj-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mj-grad-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <!-- Pierna izquierda de la M -->
  <path d="M 14 10 L 32 10 L 32 90 L 14 90 Z" fill="url(#mj-grad)"/>
  <!-- Diagonal superior izquierda -->
  <path d="M 14 10 L 32 10 L 56 56 L 44 64 Z" fill="url(#mj-grad)"/>
  <!-- Diagonal superior derecha -->
  <path d="M 86 10 L 68 10 L 44 56 L 56 64 Z" fill="url(#mj-grad)"/>
