  <path d="M 56 56 L 68 56 L 68 76 L 56 76 Z" fill="url(#mj-grad-dark)"/>
  <path d="M 46 64 L 56 64 L 56 76 L 46 76 Z" fill="url(#mj-grad-dark)"/>
