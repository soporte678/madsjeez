name: Deploy to Railway

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Generate Prisma client
      run: npx prisma generate
      env:
        DATABASE_URL: "postgresql://postgres.doweovsukuskflgnxhhn:Aug2404181976%23@aws-0-sa-east-1.pooler.supabase.com:5432/postgres"
        NEXT_PUBLIC_SUPABASE_URL: "https://doweovsukuskflgnxhhn.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_DmXmnt4V6A3tpwCq73ZIuA_a0dtWb0h"
        NEXTAUTH_URL: "https://madsjeez-production.up.railway.app"
        NEXTAUTH_SECRET: "dummy-secret-for-build-only"

    - name: Build application
      run: npm run build
      env:
        DATABASE_URL: "postgresql://postgres.doweovsukuskflgnxhhn:Aug2404181976%23@aws-0-sa-east-1.pooler.supabase.com:5432/postgres"
        NEXT_PUBLIC_SUPABASE_URL: "https://doweovsukuskflgnxhhn.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_DmXmnt4V6A3tpwCq73ZIuA_a0dtWb0h"
        NEXTAUTH_URL: "https://madsjeez-production.up.railway.app"
        NEXTAUTH_SECRET: "dummy-secret-for-build-only"

    - name: Install Railway CLI
      run: npm install -g @railway/cli

    - name: Deploy to Railway
      run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
