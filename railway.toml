# Config único para Railway (no mantener railway.json en paralelo: puede mezclarse mal con esto).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Archivo estático en /public: no pasa por API/RSC; útil si hay incidentes en rutas app.
healthcheckPath = "/railway-health.txt"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# Migraciones antes de levantar réplicas (usa DATABASE_URL del servicio). Requiere prisma/ y CLI en la imagen (Dockerfile runner).
# Railway: el array debe tener como máximo 1 elemento (todo el comando en un solo string).
preDeployCommand = ['sh -c "cd /app && prisma migrate deploy"']
# No fijar port aquí: Railway inyecta PORT en runtime; debe coincidir con el puerto real del proceso.

[environments.production]
numReplicas = 1

[environments.production.deploy]
healthcheckPath = "/railway-health.txt"
healthcheckTimeout = 300

[environments.production.env]
# Secrets (Supabase URL/keys, DATABASE_URL, MERCADOPAGO_*, MP_OAUTH_STATE_SECRET, etc.) must be set in the Railway dashboard — do not commit them here.
NEXTAUTH_URL = "https://www.madsjeez.com.ar"
NODE_ENV = "production"
# El entrypoint standalone no corre migrate en boot; las aplicamos en preDeployCommand.
SKIP_DB_MIGRATIONS_ON_BOOT = "true"
# Nunca sobreescribir PORT acá: Railway lo define para healthcheck y el proxy.
