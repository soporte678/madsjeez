[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production]
numReplicas = 1

[environments.production.deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
