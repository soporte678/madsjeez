[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production]
numReplicas = 1

[environments.production.deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
